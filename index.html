<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f4f1ff"><title>余额</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#29233d;background:#f4f1ff}*{box-sizing:border-box}body{margin:0;min-width:320px}button,input{font:inherit}button{cursor:pointer}.app,.setup{min-height:100svh;width:100%;max-width:540px;margin:auto;padding:max(24px,env(safe-area-inset-top)) 22px max(30px,env(safe-area-inset-bottom));display:flex;flex-direction:column}.top{text-align:right;height:44px;color:#756a91}.balance{flex:1;display:grid;place-items:center;font-size:clamp(48px,15vw,78px);font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.03em;color:#312752}.balance::first-letter{color:#9a7be8}.actions{display:flex;justify-content:center;gap:22px;padding:26px 0}.action{width:min(41vw,92px);height:min(41vw,92px);border:0;border-radius:30px;font-size:44px;color:#fff;box-shadow:0 12px 24px #8b72c533;transition:transform .14s}.add{background:#8c72df}.sub{background:#e79a93}.action:active{transform:scale(.95)}.sheet{position:fixed;z-index:3;bottom:0;left:50%;transform:translateX(-50%);width:min(540px,100%);background:#fff;border-radius:30px 30px 0 0;padding:26px 24px max(30px,env(safe-area-inset-bottom));box-shadow:0 -8px 30px #5b46731c}.sheet b{font-size:19px}.sheet input,.setup input{display:block;width:100%;border:0;border-bottom:2px solid #e4ddf5;background:transparent;color:#29233d;padding:14px 0;font-size:42px;outline:0}.confirm{width:100%;border:0;border-radius:18px;background:#6f55c9;color:#fff;padding:17px;margin-top:24px;font-weight:650}.setup{justify-content:center;align-items:center}.setup>div{width:min(100%,350px);text-align:center}.setup h1{font-size:25px;margin:0 0 24px;color:#40345c}.setup input{text-align:center;background:#fff;border:1px solid #e5def5;border-radius:18px;padding:15px;margin-bottom:8px}.setup .confirm{margin-top:14px}.hint{font-size:13px;color:#8c81a4}@media(prefers-color-scheme:dark){:root{color:#f5f1ff;background:#201b2c}.balance{color:#f2edff}.sheet{background:#302943}.sheet input,.setup input{color:#fff;border-color:#66578a}.setup h1{color:#f2edff}.setup input{background:#3a3150}.top{color:#b8acd0}}
</style></head><body><div id="root"></div><script>const K='balance_app_data';let d=JSON.parse(localStorage.getItem(K)||'null'),m=null;const f=c=>new Intl.NumberFormat('zh-CN',{minimumFractionDigits:c%100?2:0,maximumFractionDigits:2}).format(c/100),b=()=>d.initialBalance+d.transactions.reduce((s,t)=>s+(t.type==='add'?t.amount:-t.amount),0),v=s=>/^\d+(\.\d{0,2})?$/.test(s)&&+s>0?Math.round(+s*100):null;function r(){if(!d){root.innerHTML='<main class=setup><div><h1>设置你的余额</h1><input id=i inputmode=decimal placeholder="0.00" autofocus><div class=hint>输入初始金额</div><button class=confirm onclick="st()">开始使用</button></div></main>';return}root.innerHTML='<main class=app><header class=top>余额</header><div class=balance>¥'+f(b())+'</div><div class=actions><button class="action add" onclick="s(\'add\')">＋</button><button class="action sub" onclick="s(\'subtract\')">−</button></div></main>'}function st(){let n=v(i.value);if(n){d={initialBalance:n,transactions:[]};localStorage.setItem(K,JSON.stringify(d));r()}}function s(x){m=x;root.innerHTML+='<div class=sheet><b>'+(x==='add'?'增加金额':'减少金额')+'</b><input id=a inputmode=decimal placeholder="0.00" autofocus><button class=confirm onclick="c()">完成</button></div>';a.focus()}function c(){let n=v(a.value);if(!n)return alert('请输入有效金额');if(m==='subtract'&&n>b())return alert('余额不足');d.transactions.push({id:Date.now(),type:m,amount:n,balanceAfter:b()+(m==='add'?n:-n),createdAt:new Date().toISOString()});localStorage.setItem(K,JSON.stringify(d));r()}r();</script></body></html>
