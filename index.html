<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f5f5f7"><title>余额</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1d1d1f;background:#f5f5f7}body{margin:0}main{min-height:100svh;max-width:560px;margin:auto;padding:18px 24px;display:flex;flex-direction:column}.top{text-align:right}.balance{flex:1;display:grid;place-items:center;font-size:clamp(48px,15vw,76px);font-weight:600;font-variant-numeric:tabular-nums}.actions{display:flex;justify-content:center;gap:24px;padding:24px 0}.action{width:82px;height:82px;border-radius:24px;border:1px solid #dedee3;background:#fff;color:#1d1d1f;font-size:42px;box-shadow:0 2px 8px #0001;transition:transform .12s}.action:active{transform:scale(.96)}button{font:inherit;cursor:pointer}.sheet{position:fixed;bottom:0;left:0;right:0;background:#fff;border-radius:28px 28px 0 0;padding:24px;box-shadow:0 -4px 18px #0002}.sheet input{width:100%;font-size:42px;border:0;border-bottom:1px solid #d2d2d7;padding:10px 0}.confirm{width:100%;padding:16px;margin-top:22px;background:#1d1d1f;color:#fff;border:0;border-radius:17px;font-weight:600}@media(prefers-color-scheme:dark){:root{color:#f5f5f7;background:#1c1c1e}.action,.sheet{background:#2c2c2e;color:#f5f5f7}.confirm{background:#f5f5f7;color:#1c1c1e}}</style><main id="app"></main><script>const K='balance_app_data';let d=JSON.parse(localStorage.getItem(K)||'null'),m=null;const f=c=>new Intl.NumberFormat('zh-CN',{minimumFractionDigits:c%100?2:0,maximumFractionDigits:2}).format(c/100),b=()=>d.initialBalance+d.transactions.reduce((s,t)=>s+(t.type==='add'?t.amount:-t.amount),0),v=s=>/^\d+(\.\d{0,2})?$/.test(s)&&+s>0?Math.round(+s*100):null;function r(){if(!d){app.innerHTML='<main><h2>设置当前余额</h2><input id=i inputmode=decimal style="font-size:42px;width:100%"><button class=confirm onclick="st()">开始使用</button></main>';return}app.innerHTML='<main><header class=top>余额工具</header><div class=balance>¥'+f(b())+'</div><div class=actions><button class=action onclick="s(\'add\')">＋</button><button class=action onclick="s(\'subtract\')">−</button></div></main>'}function st(){let n=v(i.value);if(n){d={initialBalance:n,transactions:[]};localStorage.setItem(K,JSON.stringify(d));r()}}function s(x){m=x;app.innerHTML+='<div class=sheet><b>'+(x==='add'?'增加金额':'减少金额')+'</b><input id=a inputmode=decimal autofocus><button class=confirm onclick="c()">完成</button></div>';a.focus()}function c(){let n=v(a.value);if(!n)return alert('请输入有效金额');if(m==='subtract'&&n>b())return alert('余额不足');d.transactions.push({id:Date.now(),type:m,amount:n,balanceAfter:b()+(m==='add'?n:-n),createdAt:new Date().toISOString()});localStorage.setItem(K,JSON.stringify(d));r()}r();</script></html>
