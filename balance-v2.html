<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f4f1ff"><title>余额</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#30274d;background:#f4f1ff}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}.app,.page,.setup{min-height:100svh;max-width:540px;margin:auto;padding:20px 22px calc(30px + env(safe-area-inset-bottom));display:flex;flex-direction:column}.top{height:52px;display:flex;justify-content:flex-end;gap:10px}.nav{border:1px solid #ddd3f3;border-radius:16px;background:#fff;color:#69568f;padding:9px 13px;font-size:14px;box-shadow:0 3px 10px #8b72c51c}.balance{flex:1;display:grid;place-items:center;font-size:clamp(48px,15vw,78px);font-weight:650;font-variant-numeric:tabular-nums;word-break:break-word}.actions{display:flex;justify-content:center;gap:22px;padding:26px 0}.action{width:82px;height:82px;border:0;border-radius:30px;font-size:44px;color:#fff;box-shadow:0 12px 24px #8b72c533}.add{background:#8c72df}.sub{background:#e79a93}.action:active{transform:scale(.95)}.sheet{position:fixed;z-index:3;bottom:0;left:50%;transform:translateX(-50%);width:min(540px,100%);background:#fff;border-radius:30px 30px 0 0;padding:26px 24px calc(30px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px #5b46731c}.sheet input,.setup input,.setting input{display:block;width:100%;border:0;border-bottom:2px solid #e4ddf5;padding:14px 0;font-size:42px;outline:0}.voice{float:right;border:0;background:#eee7ff;border-radius:14px;padding:8px 12px;color:#765cc4}.confirm{width:100%;border:0;border-radius:18px;background:#6f55c9;color:#fff;padding:17px;margin-top:24px;font-weight:650}.setup{justify-content:center;align-items:center}.setup>div{width:min(100%,350px);text-align:center}.setup input{text-align:center;background:#fff;border:1px solid #e5def5;border-radius:18px}.back{border:0;background:transparent;color:#756a91;padding:10px}.row{display:flex;align-items:center;padding:18px 0;border-bottom:1px solid #ddd6ee}.row time{color:#8b80a4;font-size:14px;flex:1}.delete,.danger{border:0;background:transparent;color:#b36b77}@media(prefers-color-scheme:dark){:root{color:#f5f1ff;background:#201b2c}.sheet{background:#302943}.sheet input,.setup input,.setting input{color:#fff;border-color:#66578a}.setup input,.nav{background:#3a3150;color:#fff}.row{border-color:#4a405f}}
</style><main id="root"></main><script>const K='balance_app_data';let d=JSON.parse(localStorage.getItem(K)||'null'),m=null,view='home',last=null;const save=()=>localStorage.setItem(K,JSON.stringify(d)),v=s=>/^\d+(\.\d{0,2})?$/.test(s)&&+s>0?Math.round(+s*100):null,f=c=>new Intl.NumberFormat('zh-CN',{minimumFractionDigits:c%100?2:0,maximumFractionDigits:2}).format(c/100),b=()=>d.initialBalance+d.transactions.reduce((s,t)=>s+(t.type==='add'?t.amount:-t.amount),0);function r(){if(!d)return setup();if(view==='history')return hist();if(view==='settings')return settings();root.innerHTML='<main class=app><header class=top><button class=nav onclick="view=\'history\';r()">◷ 历史</button><button class=nav onclick="view=\'settings\';r()">⚙ 设置</button></header><div class=balance>¥'+f(b())+'</div><div class=actions><button class="action add" onclick="sheet(\'add\')">＋</button><button class="action sub" onclick="sheet(\'subtract\')">−</button></div></main>'}function setup(){root.innerHTML='<main class=setup><div><h1>设置你的余额</h1><input id=i inputmode=decimal placeholder="0.00" autofocus><button class=confirm onclick="start()">开始使用</button></div></main>'}function start(){let n=v(i.value);if(n){d={initialBalance:n,transactions:[]};save();r()}}function sheet(x){m=x;root.innerHTML+='<div class=sheet><b>'+(x==='add'?'增加金额':'减少金额')+'</b><button class=voice onclick="speak()">🎙 语音</button><input id=a inputmode=decimal placeholder="0.00" autofocus><button class=confirm onclick="commit()">完成</button></div>';a.focus()}function speak(){let S=window.SpeechRecognition||window.webkitSpeechRecognition;if(!S)return alert('当前浏览器不支持语音输入');let q=new S;q.lang='zh-CN';q.onresult=e=>{let t=e.results[0][0].transcript.match(/\d+(?:\.\d+)?/);if(t)a.value=t[0]};q.start()}function commit(){let n=v(a.value);if(!n)return alert('请输入有效金额');if(m==='subtract'&&n>b())return alert('余额不足');let t={id:Date.now(),type:m,amount:n,balanceAfter:b()+(m==='add'?n:-n),createdAt:new Date().toISOString()};d.transactions.push(t);last=t;save();r();setTimeout(()=>last===t&&(root.innerHTML+='<div style="position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#30274d;color:white;padding:12px 18px;border-radius:15px">已记录　<button onclick="undo()">撤销</button></div>'),30)}function undo(){d.transactions=d.transactions.filter(t=>t.id!==last.id);save();last=null;r()}function hist(){root.innerHTML='<main class=page><button class=back onclick="view=\'home\';r()">‹ 返回</button><h2>历史记录</h2>'+(d.transactions.length?d.transactions.slice().reverse().map(t=>'<div class=row><time>'+new Date(t.createdAt).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})+'</time><span>'+(t.type==='add'?'+':'−')+' ¥'+f(t.amount)+'</span><button class=delete onclick="del('+t.id+')">删除</button></div>').join(''):'<p style="color:#8b80a4;text-align:center;margin-top:30vh">还没有记录</p>')+'</main>'}function del(id){d.transactions=d.transactions.filter(t=>t.id!==id);save();hist()}function settings(){root.innerHTML='<main class=page><button class=back onclick="view=\'home\';r()">‹ 返回</button><h2>设置</h2><label class=setting>初始余额<input id=base value="'+(d.initialBalance/100).toFixed(2)+'"></label><button class=confirm onclick="chg()">保存初始余额</button><button class=danger onclick="rst()">清空全部数据</button></main>'}function chg(){let n=v(base.value);if(n){d.initialBalance=n;save();r()}}function rst(){if(confirm('确定清空全部记录？')){localStorage.removeItem(K);d=null;r()}}r();</script></html>
