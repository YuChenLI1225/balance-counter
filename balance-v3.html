<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f4f1ff"><title>余额</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#30274d;background:#f4f1ff}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}.app,.page,.setup{min-height:100svh;max-width:540px;margin:auto;padding:20px 22px;display:flex;flex-direction:column}.top{height:52px;display:flex;justify-content:flex-end;gap:10px}.nav,.voice{border:1px solid #ddd3f3;border-radius:16px;background:#fff;color:#69568f;padding:10px 13px;font-weight:650;box-shadow:0 3px 10px #8b72c51c}.nav svg{vertical-align:-3px;margin-right:5px}.balance{flex:1;display:grid;place-items:center;font-size:clamp(48px,15vw,78px);font-weight:650;font-variant-numeric:tabular-nums;word-break:break-word}.actions{display:flex;justify-content:center;gap:22px;padding:20px 0}.action{width:82px;height:82px;border:0;border-radius:30px;font-size:44px;color:#fff;box-shadow:0 12px 24px #8b72c533}.add{background:#8c72df}.sub{background:#e79a93}.voice{align-self:center;margin-bottom:20px}.sheet{position:fixed;z-index:3;bottom:0;left:50%;transform:translateX(-50%);width:min(540px,100%);background:#fff;border-radius:30px 30px 0 0;padding:26px 24px 30px;box-shadow:0 -8px 30px #5b46731c}.sheet input,.setup input{display:block;width:100%;border:0;border-bottom:2px solid #e4ddf5;padding:14px 0;font-size:42px;outline:0}.confirm{width:100%;border:0;border-radius:18px;background:#6f55c9;color:#fff;padding:17px;margin-top:24px;font-weight:650}.setup{justify-content:center;align-items:center}.setup>div{width:min(100%,350px);text-align:center}.setup input{text-align:center;background:#fff;border:1px solid #e5def5;border-radius:18px}.row{display:flex;align-items:center;padding:18px 0;border-bottom:1px solid #ddd6ee}.row time{color:#8b80a4;font-size:14px;flex:1}.delete,.back,.danger{border:0;background:transparent;color:#b36b77;padding:10px}.back{color:#756a91}.setting input{width:100%;padding:12px;border:1px solid #e5def5;border-radius:16px;margin-top:8px}@media(prefers-color-scheme:dark){:root{color:#f5f1ff;background:#201b2c}.nav,.voice,.sheet,.setup input{background:#302943;color:#fff}.sheet input,.setting input{color:#fff;border-color:#66578a}.row{border-color:#4a405f}}
</style><div id="root"></div><script>const K='balance_app_data';let d=JSON.parse(localStorage.getItem(K)||'null'),view='home';const save=()=>localStorage.setItem(K,JSON.stringify(d)),num=s=>/^\d+(\.\d{1,2})?$/.test(s)?Math.round(+s*100):0,fmt=c=>new Intl.NumberFormat('zh-CN',{minimumFractionDigits:c%100?2:0,maximumFractionDigits:2}).format(c/100),bal=()=>d.initialBalance+d.transactions.reduce((s,t)=>s+(t.type==='add'?t.amount:-t.amount),0);function render(){if(!d)return setup();if(view==='history')return history();if(view==='settings')return settings();root.innerHTML='<main class=app><header class=top><button class=nav onclick="view=\'history\';render()">◷ 历史</button><button class=nav onclick="view=\'settings\';render()">⚙ 设置</button></header><div class=balance>¥'+fmt(bal())+'</div><button class=voice onclick="voice()">🎙 语音记一笔</button><div class=actions><button class="action add" onclick="sheet(\'add\')">＋</button><button class="action sub" onclick="sheet(\'subtract\')">−</button></div></main>'}function setup(){root.innerHTML='<main class=setup><div><h1>设置你的余额</h1><input id=i inputmode=decimal placeholder="0.00"><button class=confirm onclick="start()">开始使用</button></div></main>'}function start(){let n=num(i.value);if(n){d={initialBalance:n,transactions:[]};save();render()}}function sheet(t){let s=prompt(t==='add'?'增加金额':'减少金额','');let n=num(s||'');if(!n)return;if(t==='subtract'&&n>bal())return alert('余额不足');d.transactions.push({id:Date.now(),type:t,amount:n,balanceAfter:bal()+(t==='add'?n:-n),createdAt:new Date().toISOString()});save();render()}function voice(){let S=SpeechRecognition||webkitSpeechRecognition;if(!S)return alert('当前浏览器不支持语音输入');let q=new S;q.lang='zh-CN';q.onresult=e=>{let text=e.results[0][0].transcript.replaceAll('，',',');let re=/(加|增加|收入|减|减少|支出)\s*(\d+(?:\.\d{1,2})?)/g,m,ok=0;while((m=re.exec(text))){let n=num(m[2]),t=/减|减少|支出/.test(m[1])?'subtract':'add';if(t==='subtract'&&n>bal())break;d.transactions.push({id:Date.now()+ok,type:t,amount:n,balanceAfter:bal()+(t==='add'?n:-n),createdAt:new Date().toISOString()});ok++}if(ok){save();render()}else alert('请说“加500，减20”')};q.start()}function history(){root.innerHTML='<main class=page><button class=back onclick="view=\'home\';render()">‹ 返回</button><h2>历史记录</h2>'+(d.transactions.length?d.transactions.slice().reverse().map(t=>'<div class=row><time>'+new Date(t.createdAt).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})+'</time><span>'+(t.type==='add'?'+':'−')+' ¥'+fmt(t.amount)+'</span><button class=delete onclick="del('+t.id+')">删除</button></div>').join(''):'<p style="color:#8b80a4;text-align:center;margin-top:30vh">还没有记录</p>')+'</main>'}function del(id){d.transactions=d.transactions.filter(t=>t.id!==id);save();history()}function settings(){root.innerHTML='<main class=page><button class=back onclick="view=\'home\';render()">‹ 返回</button><h2>设置</h2><label>初始余额<input class=setting id=base value="'+(d.initialBalance/100).toFixed(2)+'"></label><button class=confirm onclick="chg()">保存初始余额</button><button class=danger onclick="rst()">清空全部数据</button></main>'}function chg(){let n=num(base.value);if(n){d.initialBalance=n;save();render()}}function rst(){if(confirm('确定清空全部记录？')){localStorage.removeItem(K);d=null;render()}}render();</script></html>
